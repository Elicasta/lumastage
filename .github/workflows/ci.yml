name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  desktop-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: mkdir -p src-tauri/icons && cp .github/assets/lumastage-ci-icon.png src-tauri/icons/icon.png
      - run: cargo check --manifest-path src-tauri/Cargo.toml
